<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codestudio — 게시판</title>
<script>try { if (localStorage.getItem("sap-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}</script>
<link rel="stylesheet" href="assets/style.css?v=dark-menu-contrast-1">
<style>
  .post-title-btn {
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    text-decoration: underline;
    cursor: pointer;
    font-size: inherit;
    font-family: inherit;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-box {
    background: #fff;
    max-width: 560px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    border-radius: 8px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
  }
  .modal-box h3 { margin-top: 0; }
  .modal-meta { color: #888; font-size: 0.9em; margin-bottom: 16px; }
  .modal-content { white-space: pre-wrap; line-height: 1.6; }
  .modal-close {
    margin-top: 20px;
    display: inline-block;
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">SAP</div>
    <nav class="nav-group">
      <div class="nav-label">MENU</div>
      <a href="index.html">홈</a>
      <a href="calendar.html">일정</a>
      <a href="learn.html">학습</a>
      <a href="board.html" class="active">게시판</a>
      <a href="files.html">자료실</a>
      <a href="game.html">게임제작</a>
      <a href="login.html" data-auth-link>로그인 / 회원가입</a>
    </nav>
    <button class="theme-toggle" type="button" data-theme-toggle>◐ 블랙모드</button>
    <div class="sidebar-footer">v0.1 · local build</div>
  </aside>
  <main class="main">
    <div class="eyebrow">BOARD</div>
    <h1>게시판</h1>
    <p class="lead">
      학습일지, 질문, 공지를 남기는 공간입니다. Java(Spring Boot) 백엔드와 PostgreSQL(Neon)에
      연결되어 있어 작성한 글은 서버가 재시작되어도 계속 보존됩니다.
    </p>

    <form id="post-form" class="card">
      <h3>새 글 쓰기</h3>
      <div class="form-row">
        <input type="text" id="title" placeholder="제목" required>
      </div>
      <div class="form-row">
        <textarea id="content" rows="3" placeholder="내용" required></textarea>
      </div>
      <button type="submit">등록</button>
      <span id="form-status" class="form-status"></span>
    </form>

    <table>
      <thead>
        <tr><th>번호</th><th>제목</th><th>작성일</th><th></th></tr>
      </thead>
      <tbody id="post-list">
        <tr><td colspan="4">불러오는 중...</td></tr>
      </tbody>
    </table>
  </main>
</div>

<div id="post-modal" class="modal-overlay" hidden>
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <div id="modal-meta" class="modal-meta"></div>
    <div id="modal-content" class="modal-content"></div>
    <button id="modal-close" class="modal-close">닫기</button>
  </div>
</div>

<script src="assets/auth.js"></script>
<script>
  const API_BASE = "https://board-backend-nngx.onrender.com/api/posts";

  // 목록을 불러올 때마다 받아온 글 전체(제목+내용)를 여기에 저장해두고,
  // "상세 보기"를 누르면 서버에 다시 요청하지 않고 이 캐시에서 바로 꺼내 보여줍니다.
  let postsCache = [];

  async function loadPosts() {
    const listEl = document.getElementById("post-list");
    try {
      const res = await SAPAuth.apiFetch(API_BASE);
      if (!res.ok) throw new Error("서버 응답 오류");
      const posts = await res.json();
      postsCache = posts;

      if (posts.length === 0) {
        listEl.innerHTML = '<tr><td colspan="4">등록된 글이 없습니다.</td></tr>';
        return;
      }

      listEl.innerHTML = posts.map(p => `
        <tr>
          <td>${p.id}</td>
          <td><button type="button" class="post-title-btn" data-id="${p.id}">${escapeHtml(p.title)}</button></td>
          <td>${p.created_at}</td>
          <td><button data-id="${p.id}" class="delete-btn">삭제</button></td>
        </tr>
      `).join("");

      document.querySelectorAll(".post-title-btn").forEach(btn => {
        btn.addEventListener("click", () => openPost(btn.dataset.id));
      });
      document.querySelectorAll(".delete-btn").forEach(btn => {
        btn.addEventListener("click", () => deletePost(btn.dataset.id));
      });
    } catch (err) {
      listEl.innerHTML =
        '<tr><td colspan="4">서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요 (무료 서버는 깨어나는 데 최대 1분 정도 걸릴 수 있습니다).</td></tr>';
    }
  }

  function openPost(id) {
    const post = postsCache.find(p => String(p.id) === String(id));
    if (!post) return;

    document.getElementById("modal-title").textContent = post.title;
    document.getElementById("modal-meta").textContent = `번호 ${post.id} · 작성일 ${post.created_at}`;
    document.getElementById("modal-content").textContent = post.content;
    document.getElementById("post-modal").hidden = false;
  }

  function closePost() {
    document.getElementById("post-modal").hidden = true;
  }

  async function deletePost(id) {
    await SAPAuth.apiFetch(`${API_BASE}/${id}`, { method: "DELETE" });
    loadPosts();
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById("post-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const title = document.getElementById("title").value.trim();
    const content = document.getElementById("content").value.trim();
    const statusEl = document.getElementById("form-status");

    try {
      const res = await SAPAuth.apiFetch(API_BASE, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, content }),
      });
      if (!res.ok) throw new Error();

      statusEl.textContent = "등록되었습니다.";
      document.getElementById("post-form").reset();
      loadPosts();
    } catch (err) {
      statusEl.textContent = "등록 실패 — 서버 연결을 확인하세요.";
    }
  });

  document.getElementById("modal-close").addEventListener("click", closePost);
  document.getElementById("post-modal").addEventListener("click", (e) => {
    if (e.target.id === "post-modal") closePost();
  });

  SAPAuth.requireSession().then(user => {
    if (user?.unavailable) {
      document.getElementById("post-list").innerHTML = '<tr><td colspan="4">인증 서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.</td></tr>';
      return;
    }
    if (user) loadPosts();
  });
</script>
<script src="assets/theme.js"></script>
</body>
</html>
