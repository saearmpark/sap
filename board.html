<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사피엔스 — 자유 게시판</title>
<script>try { if (localStorage.getItem("sap-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}</script>
<link rel="stylesheet" href="assets/style.css?v=labels-7">
<style>
  .post-title-btn {
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    text-decoration: underline;
    cursor: pointer;
    font-size: inherit;
    font-family: inherit;
  }
  .board-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .board-toolbar input[type="search"], .board-toolbar select {
    min-height: 40px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
  }
  .board-toolbar input[type="search"] { flex: 1 1 220px; }
  .row-actions { display: flex; gap: 6px; }
  .row-actions button { padding: 5px 9px; }
  .edit-btn { background: transparent; color: var(--ink-soft); border: 1px solid var(--border); }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-box {
    background: #fff;
    max-width: 560px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    border-radius: 8px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
  }
  .modal-box h3 { margin-top: 0; }
  .modal-meta { color: #888; font-size: 0.9em; margin-bottom: 16px; }
  .modal-content { white-space: pre-wrap; line-height: 1.6; }
  .modal-close {
    margin-top: 20px;
    display: inline-block;
  }
  .comment-section { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 14px; }
  .comment-section h4 { margin: 0 0 10px; }
  .comment-list { display: grid; gap: 8px; padding: 0; margin: 0 0 12px; list-style: none; }
  .comment-list li { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); font-size: 14px; }
  .comment-list li .comment-body { flex: 1; overflow-wrap: anywhere; }
  .comment-list li .comment-meta { flex: none; color: var(--ink-soft); font-size: 12px; }
  .comment-form { display: flex; gap: 8px; align-items: flex-start; }
  .comment-form textarea { flex: 1; min-height: 44px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; resize: vertical; }
  .comment-empty { color: var(--ink-soft); font-size: 13px; margin: 0 0 12px; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <nav class="nav-group">
      <a href="index.html">홈</a>
      <a href="search.html">검색</a>
      <a href="news.html">소식</a>
      <details class="nav-menu">
        <summary>제작</summary>
        <div class="nav-submenu">
          <a href="learn.html">앱</a>
          <a href="game.html">게임</a>
        </div>
      </details>
      <details class="nav-menu" open>
        <summary>소통</summary>
        <div class="nav-submenu">
          <a href="board.html" class="active" aria-current="page">자유 게시판</a>
          <a href="notice.html">공지사항</a>
          <a href="chat.html">실시간 대화</a>
        </div>
      </details>
      <details class="nav-menu">
        <summary>자료</summary>
        <div class="nav-submenu">
          <a href="files.html">개인자료</a>
          <a href="apps.html">공용자료</a>
        </div>
      </details>
      <details class="nav-menu">
        <summary>계정</summary>
        <div class="nav-submenu">
          <a href="calendar.html">일정</a>
          <a href="login.html" data-auth-link>로그인 / 회원가입</a>
        </div>
      </details>
    </nav>
    <button class="theme-toggle" type="button" data-theme-toggle>◐ 블랙모드</button>
  </aside>
  <main class="main">
    <div class="eyebrow">BOARD</div>
    <h1>자유 게시판</h1>

    <form id="post-form" class="card">
      <h3 id="post-form-title">새 글 쓰기</h3>
      <div class="form-row">
        <input type="text" id="title" placeholder="제목" required>
      </div>
      <div class="form-row">
        <textarea id="content" rows="3" placeholder="내용" required></textarea>
      </div>
      <div class="row-actions">
        <button type="submit" id="post-submit">등록</button>
        <button type="button" id="post-cancel" class="edit-btn" hidden>취소</button>
      </div>
      <span id="form-status" class="form-status"></span>
    </form>

    <form id="filter-form" class="card board-toolbar">
      <input id="search" type="search" placeholder="제목·내용 검색" autocomplete="off">
      <button type="submit">검색</button>
      <button type="button" id="filter-reset" class="edit-btn">초기화</button>
      <span id="filter-status" class="form-status" aria-live="polite"></span>
    </form>

    <table>
      <thead>
        <tr><th>번호</th><th>제목</th><th>작성자</th><th>작성일</th><th></th></tr>
      </thead>
      <tbody id="post-list">
        <tr><td colspan="5">불러오는 중...</td></tr>
      </tbody>
    </table>
  </main>
</div>

<div id="post-modal" class="modal-overlay" hidden>
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <div id="modal-meta" class="modal-meta"></div>
    <div id="modal-content" class="modal-content"></div>
    <div class="comment-section">
      <h4>댓글</h4>
      <ul id="comment-list" class="comment-list"></ul>
      <form id="comment-form" class="comment-form">
        <textarea id="comment-input" maxlength="2000" rows="2" placeholder="댓글을 입력하세요" required></textarea>
        <button type="submit">댓글 등록</button>
      </form>
      <span id="comment-status" class="form-status" aria-live="polite"></span>
    </div>
    <button id="modal-close" class="modal-close">닫기</button>
  </div>
</div>

<script src="assets/auth.js?v=labels-7"></script>
<script>
  const API_BASE = "https://board-backend-nngx.onrender.com/api/posts";

  // 목록을 불러올 때마다 받아온 글 전체(제목+내용)를 여기에 저장해두고,
  // "상세 보기"를 누르면 서버에 다시 요청하지 않고 이 캐시에서 바로 꺼내 보여줍니다.
  let postsCache = [];
  let editingId = null;
  let currentPostId = null;

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function canModify(authorName) {
    const user = SAPAuth.getUser();
    return Boolean(user && (user.isAdmin || user.username === authorName));
  }

  async function loadPosts() {
    const listEl = document.getElementById("post-list");
    const filterStatus = document.getElementById("filter-status");
    const params = new URLSearchParams();
    const keyword = document.getElementById("search").value.trim();
    if (keyword) params.set("q", keyword);
    const url = params.toString() ? `${API_BASE}?${params}` : API_BASE;
    try {
      const res = await SAPAuth.apiFetch(url);
      if (!res.ok) throw new Error("서버 응답 오류");
      const posts = await res.json();
      postsCache = posts;
      filterStatus.textContent = keyword ? `${posts.length}건을 찾았습니다.` : "";

      if (posts.length === 0) {
        listEl.innerHTML = `<tr><td colspan="5">${keyword ? "조건에 맞는 글이 없습니다." : "등록된 글이 없습니다."}</td></tr>`;
        return;
      }

      listEl.innerHTML = posts.map(p => `
        <tr>
          <td>${p.id}</td>
          <td><button type="button" class="post-title-btn" data-id="${p.id}">${escapeHtml(p.title)}</button></td>
          <td>${escapeHtml(p.author_name || "-")}</td>
          <td>${escapeHtml(p.created_at || "")}</td>
          <td><div class="row-actions">
            ${canModify(p.author_name) ? `<button data-id="${p.id}" class="edit-btn edit">수정</button>` : ""}
            ${canModify(p.author_name) ? `<button data-id="${p.id}" class="delete-btn delete">삭제</button>` : ""}
          </div></td>
        </tr>
      `).join("");

      document.querySelectorAll(".post-title-btn").forEach(btn => {
        btn.addEventListener("click", () => openPost(btn.dataset.id));
      });
      document.querySelectorAll(".delete").forEach(btn => {
        btn.addEventListener("click", () => deletePost(btn.dataset.id));
      });
      document.querySelectorAll(".edit").forEach(btn => {
        btn.addEventListener("click", () => startEdit(btn.dataset.id));
      });
    } catch (err) {
      listEl.innerHTML =
        '<tr><td colspan="5">서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요 (무료 서버는 깨어나는 데 최대 1분 정도 걸릴 수 있습니다).</td></tr>';
    }
  }

  function startEdit(id) {
    const post = postsCache.find(p => String(p.id) === String(id));
    if (!post) return;
    editingId = post.id;
    document.getElementById("title").value = post.title;
    document.getElementById("content").value = post.content;
    document.getElementById("post-form-title").textContent = `글 수정 (#${post.id})`;
    document.getElementById("post-submit").textContent = "수정 저장";
    document.getElementById("post-cancel").hidden = false;
    document.getElementById("form-status").textContent = "";
    document.getElementById("post-form").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function resetForm() {
    editingId = null;
    document.getElementById("post-form").reset();
    document.getElementById("post-form-title").textContent = "새 글 쓰기";
    document.getElementById("post-submit").textContent = "등록";
    document.getElementById("post-cancel").hidden = true;
  }

  function openPost(id) {
    const post = postsCache.find(p => String(p.id) === String(id));
    if (!post) return;
    currentPostId = post.id;

    document.getElementById("modal-title").textContent = post.title;
    document.getElementById("modal-meta").textContent =
      `번호 ${post.id} · 작성자 ${post.author_name || "미등록"} · 작성일 ${post.created_at || ""}`;
    document.getElementById("modal-content").textContent = post.content;
    document.getElementById("comment-status").textContent = "";
    document.getElementById("comment-form").reset();
    document.getElementById("post-modal").hidden = false;
    loadComments();
  }

  function closePost() {
    document.getElementById("post-modal").hidden = true;
    currentPostId = null;
  }

  async function loadComments() {
    const listEl = document.getElementById("comment-list");
    listEl.innerHTML = "<li>불러오는 중...</li>";
    try {
      const res = await SAPAuth.apiFetch(`${API_BASE}/${currentPostId}/comments`);
      if (!res.ok) throw new Error();
      const items = await res.json();
      if (items.length === 0) {
        listEl.innerHTML = '<li class="comment-empty">아직 댓글이 없습니다.</li>';
        return;
      }
      listEl.innerHTML = items.map(c => `
        <li>
          <span class="comment-body">${escapeHtml(c.content)}<br><span class="comment-meta">${escapeHtml(c.author_name || "-")} · ${escapeHtml(c.created_at || "")}</span></span>
          ${canModify(c.author_name) ? `<button type="button" class="delete-btn" data-comment-id="${c.id}">삭제</button>` : ""}
        </li>
      `).join("");
      listEl.querySelectorAll("[data-comment-id]").forEach(btn => {
        btn.addEventListener("click", () => deleteComment(btn.dataset.commentId));
      });
    } catch {
      listEl.innerHTML = '<li class="comment-empty">댓글을 불러오지 못했습니다.</li>';
    }
  }

  async function deleteComment(commentId) {
    await SAPAuth.apiFetch(`${API_BASE}/${currentPostId}/comments/${commentId}`, { method: "DELETE" });
    loadComments();
  }

  async function deletePost(id) {
    if (!confirm("이 글을 삭제할까요? 달린 댓글도 함께 삭제됩니다.")) return;
    await SAPAuth.apiFetch(`${API_BASE}/${id}`, { method: "DELETE" });
    if (editingId === id) resetForm();
    loadPosts();
  }

  document.getElementById("post-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const title = document.getElementById("title").value.trim();
    const content = document.getElementById("content").value.trim();
    const statusEl = document.getElementById("form-status");
    const editing = editingId;

    try {
      const res = await SAPAuth.apiFetch(editing ? `${API_BASE}/${editing}` : API_BASE, {
        method: editing ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, content }),
      });
      if (!res.ok) throw new Error();

      statusEl.textContent = editing ? "수정되었습니다." : "등록되었습니다.";
      resetForm();
      loadPosts();
    } catch (err) {
      statusEl.textContent = editing ? "수정 실패 — 서버 연결을 확인하세요." : "등록 실패 — 서버 연결을 확인하세요.";
    }
  });

  document.getElementById("post-cancel").addEventListener("click", () => {
    resetForm();
    document.getElementById("form-status").textContent = "";
  });

  document.getElementById("filter-form").addEventListener("submit", (e) => {
    e.preventDefault();
    loadPosts();
  });
  document.getElementById("filter-reset").addEventListener("click", () => {
    document.getElementById("search").value = "";
    document.getElementById("filter-status").textContent = "";
    loadPosts();
  });

  document.getElementById("comment-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("comment-input");
    const statusEl = document.getElementById("comment-status");
    const content = input.value.trim();
    if (!content || !currentPostId) return;
    try {
      const res = await SAPAuth.apiFetch(`${API_BASE}/${currentPostId}/comments`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content }),
      });
      if (!res.ok) throw new Error();
      statusEl.textContent = "";
      input.value = "";
      loadComments();
    } catch (err) {
      statusEl.textContent = "댓글 등록에 실패했습니다.";
    }
  });

  document.getElementById("modal-close").addEventListener("click", closePost);
  document.getElementById("post-modal").addEventListener("click", (e) => {
    if (e.target.id === "post-modal") closePost();
  });

  SAPAuth.requireSession().then(user => {
    if (user?.unavailable) {
      document.getElementById("post-list").innerHTML = '<tr><td colspan="5">인증 서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.</td></tr>';
      return;
    }
    if (user) loadPosts();
  });
</script>
<script src="assets/theme.js"></script>
</body>
</html>
