# 서버 포트 (Flask 서버와 동시에 켜도 충돌하지 않도록 8080 사용)
server.port=8080

# 데이터베이스 환경변수가 있으면 해당 설정을 사용하고, 없으면 로컬 H2 파일 DB를 사용합니다.
# Render에서 PostgreSQL을 사용하려면 URL, 드라이버, 사용자명, 비밀번호를 서비스 환경변수로 설정하세요.
# 데이터 보존은 연결된 DB와 호스팅 설정에 따릅니다. 자료실 파일은 별도의 uploads 폴더에 저장됩니다.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/board;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# 최초 관리자 계정 생성용 환경변수 (비밀번호를 저장소에 기록하지 마세요)
sap.admin.username=${SAP_ADMIN_USERNAME:}
sap.admin.password=${SAP_ADMIN_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 한글 인코딩 강제
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 자료실 파일 업로드 용량 제한 (기본값 1MB는 너무 작아서 20MB로 늘립니다)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
