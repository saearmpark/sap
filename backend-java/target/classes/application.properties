# 서버 포트 (Flask 서버와 동시에 켜도 충돌하지 않도록 8080 사용)
server.port=8080

# 환경변수(SPRING_DATASOURCE_*)가 설정되어 있으면 그 값을, 없으면 콜론(:) 뒤의 기본값(H2)을 씁니다.
# - 로컬(VS Code Run 버튼)에서는 환경변수를 따로 안 주므로 자동으로 H2(파일)로 동작합니다.
# - Render에 배포할 때는 이 네 개의 환경변수를 Neon(PostgreSQL) 값으로 채워주면, 코드 수정 없이
#   데이터가 절대 사라지지 않는 PostgreSQL을 쓰게 됩니다.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/board;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
