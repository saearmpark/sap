    <h1>투자정보</h1>
    <p>국내·미국 시가총액 상위 종목과 대표 ETF, 원/달러 환율, 비트코인, 금 ETF, WTI 유가 시세를 10초마다 갱신합니다. 정규장 밖의 장전·시간외 값은 배지로 구분하고, 아래에는 경제 관련 소식을 함께 보여줍니다.</p>

<script src="assets/auth.js?v=labels-14"></script>
<script>
  (() => {
    const API = window.SAPAuth?.API_ROOT || "https://board-backend-nngx.onrender.com/api";
    const listEl = document.getElementById("stocks-list");
    const statusEl = document.getElementById("stocks-status");
    const GROUPS = ["국내", "미국", "환율", "코인", "기타"];
    const CACHE_KEY = "sap-stocks-cache";
    let lastSignature = "";

    function readCache() {
      try {
        const raw = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
        return Array.isArray(raw) && raw.length ? raw : null;
      } catch { return null; }
    }

    function writeCache(quotes) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(quotes)); } catch {}
    }

    function relTime(iso) {
      if (!iso) return "";
      const time = new Date(iso).getTime();
      if (Number.isNaN(time)) return "";
      const seconds = Math.round((Date.now() - time) / 1000);
      if (seconds < 5) return "방금 전";
      if (seconds < 60) return `${seconds}초 전`;
      const minutes = Math.round(seconds / 60);
      return `${minutes}분 전`;
    }

    function formatPrice(value, currency) {
      if (!Number.isFinite(value)) return "-";
      if (currency === "KRW") {
        return value.toLocaleString("ko-KR", { maximumFractionDigits: 2 }) + "원";
      }
      if (currency === "USD") {
        return "$" + value.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
      if (currency === "%") {
        return value.toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 3 }) + "%";
      }
      if (currency === "pt") {
        return value.toLocaleString("ko-KR", { maximumFractionDigits: 2 }) + " pt";
      }
      const text = value.toLocaleString("ko-KR", { maximumFractionDigits: 4 });
      return currency ? `${text} ${currency}` : text;
    }

    function card(quote) {
      const up = quote.change >= 0;
      const isRate = quote.currency === "%";
      const article = document.createElement("article");
      article.className = "stock-card";

      const top = document.createElement("div");
      top.className = "stock-top";

      const names = document.createElement("div");
      names.className = "stock-names";
      const name = document.createElement("div");
      name.className = "stock-name";
      name.textContent = quote.name;
      const symbol = document.createElement("div");
      symbol.className = "stock-symbol";
      symbol.textContent = quote.symbol;
      names.append(name, symbol);
      if (quote.session === "pre" || quote.session === "post") {
        const badge = document.createElement("span");
        badge.className = "stock-session";
        badge.textContent = quote.session === "pre" ? "장전" : "시간외";
        names.append(badge);
      } else if (quote.marketState === "closed") {
        const badge = document.createElement("span");
        badge.className = "stock-session";
        badge.textContent = "장 마감";
        badge.title = "마지막 거래일 종가 기준";
        names.append(badge);
      }

      const numbers = document.createElement("div");
      numbers.className = "stock-numbers";
      const price = document.createElement("div");
      price.className = "stock-price";
      price.textContent = formatPrice(quote.price, quote.currency);
      const change = document.createElement("div");
      change.className = "stock-change " + (up ? "is-up" : "is-down");
      const arrow = quote.change > 0 ? "▲" : quote.change < 0 ? "▼" : "–";
      const percent = Math.abs(quote.changePercent).toFixed(2);
      const diff = formatPrice(Math.abs(quote.change), quote.currency);
      if (quote.change === 0) {
        change.textContent = isRate ? "– 0.000%p" : "– 0.00%";
      } else if (isRate) {
        change.textContent = `${arrow} ${Math.abs(quote.change).toFixed(3)}%p`;
      } else {
        change.textContent = `${arrow} ${percent}% · ${diff}`;
      }
      numbers.append(price, change);

      top.append(names, numbers);
      article.append(top);
      return article;
    }

    function render(quotes) {
      const nodes = [];
      GROUPS.forEach(group => {
        const items = quotes.filter(quote => quote.group === group);
        if (!items.length) return;
        const heading = document.createElement("h2");
        heading.className = "stocks-group-title";
        heading.textContent = group;
        nodes.push(heading);
        const grid = document.createElement("div");
        grid.className = "stock-grid";
        items.forEach(quote => grid.appendChild(card(quote)));
        nodes.push(grid);
      });
      listEl.replaceChildren(...nodes);
    }

    async function load() {
      try {
        const response = await fetch(`${API}/stocks`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const quotes = Array.isArray(data.quotes) ? data.quotes : [];
        if (!quotes.length) {
          statusEl.textContent = "시세 정보를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.";
          return;
        }
        statusEl.textContent = `시세 ${quotes.length}건 · ${relTime(data.updatedAt)} 갱신${data.partial ? " · 일부 시세 지연" : ""}`;
        const signature = JSON.stringify(quotes);
        if (signature !== lastSignature) {
          lastSignature = signature;
          render(quotes);
        }
        writeCache(quotes);
      } catch (error) {
        statusEl.textContent = readCache()
          ? "서버 연결이 느립니다. 저장된 시세를 표시합니다."
          : "시세 정보를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.";
      }
    }

    const cachedQuotes = readCache();
    if (cachedQuotes) {
      lastSignature = JSON.stringify(cachedQuotes);
      render(cachedQuotes);
      statusEl.textContent = "저장된 시세를 먼저 표시합니다...";
    }

    load();
    setInterval(load, 10 * 1000);
  })();
</script>
<script>
  (() => {
    const API = window.SAPAuth?.API_ROOT || "https://board-backend-nngx.onrender.com/api";
    const listEl = document.getElementById("investment-news-list");
    const statusEl = document.getElementById("investment-news-status");
    const CACHE_KEY = "sap-investment-news-cache";
    let items = [];

    function readCache() {
      try {
        const raw = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
        return raw && Array.isArray(raw.items) && raw.items.length ? raw : null;
      } catch { return null; }
    }

    function writeCache(data) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ items: data, savedAt: Date.now() })); } catch {}
    }

    function relTime(iso) {
      if (!iso) return "";
      const time = new Date(iso).getTime();
      if (Number.isNaN(time)) return "";
      const minutes = Math.round((Date.now() - time) / 60000);
      if (minutes < 1) return "방금 전";
      if (minutes < 60) return `${minutes}분 전`;
      const hours = Math.round(minutes / 60);
      if (hours < 24) return `${hours}시간 전`;
      return `${Math.round(hours / 24)}일 전`;
    }

    function card(item) {
      const link = document.createElement("a");
      link.className = "news-card";
      link.href = item.link;
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      if (item.imageUrl) {
        const thumb = document.createElement("img");
        thumb.className = "news-thumb";
        thumb.src = item.imageUrl;
        thumb.alt = "";
        thumb.loading = "lazy";
        thumb.referrerPolicy = "no-referrer";
        thumb.addEventListener("error", () => thumb.remove());
        link.appendChild(thumb);
      }

      const body = document.createElement("div");
      body.className = "news-body";

      const title = document.createElement("h3");
      title.textContent = item.title;
      body.appendChild(title);

      const meta = document.createElement("div");
      meta.className = "news-meta";
      if (item.source) {
        const source = document.createElement("span");
        source.textContent = item.source;
        meta.appendChild(source);
      }
      const time = document.createElement("span");
      time.textContent = relTime(item.publishedAt || item.fetchedAt);
      meta.appendChild(time);
      body.appendChild(meta);

      if (item.summary) {
        const summary = document.createElement("p");
        summary.className = "news-summary";
        summary.textContent = item.summary;
        body.appendChild(summary);
      }

      link.appendChild(body);
      return link;
    }

    function render() {
      if (!items.length) {
        const empty = document.createElement("p");
        empty.className = "news-empty";
        empty.textContent = "표시할 경제 소식이 없습니다.";
        listEl.replaceChildren(empty);
        return;
      }
      listEl.replaceChildren(...items.map(card));
    }

    async function load() {
      const cached = readCache();
      if (cached) {
        items = cached.items;
        render();
        statusEl.textContent = `저장된 경제 소식 ${items.length}건을 먼저 표시합니다...`;
      } else {
        statusEl.textContent = "경제 소식을 불러오는 중입니다...";
      }
      try {
        const response = await fetch(`${API}/news?category=${encodeURIComponent("경제")}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        items = await response.json();
        render();
        if (items.length) {
          writeCache(items);
          const updated = items[0]?.fetchedAt || items[0]?.publishedAt;
          statusEl.textContent = `경제 소식 ${items.length}건 · ${relTime(updated)} 갱신`;
        } else {
          statusEl.textContent = "아직 수집된 경제 소식이 없습니다. 잠시 후 다시 확인해주세요.";
        }
      } catch (error) {
        statusEl.textContent = readCache()
          ? "서버 연결이 느립니다. 저장된 경제 소식을 표시합니다."
          : "경제 소식을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.";
      }
    }

    load();
    setInterval(load, 5 * 60 * 1000);
  })();
</script>
