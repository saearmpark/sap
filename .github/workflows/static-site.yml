name: Static site checks

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "assets/**"
      - "sw.js"
      - "manifest.webmanifest"
      - "robots.txt"
      - "sitemap.xml"
      - ".github/scripts/**"
      - ".github/workflows/static-site.yml"
  pull_request:
    paths:
      - "*.html"
      - "assets/**"
      - "sw.js"
      - "manifest.webmanifest"
      - "robots.txt"
      - "sitemap.xml"
      - ".github/scripts/**"
      - ".github/workflows/static-site.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check shared scripts
        run: |
          for file in assets/*.js; do
            node --check "$file"
          done
      - name: Check inline scripts
        run: node .github/scripts/check-inline-scripts.mjs
      - name: Check page list and links
        run: node .github/scripts/check-links.mjs
      - name: Check shared asset versions
        run: node .github/scripts/check-assets.mjs
      - name: Check metadata and sitemap
        run: node .github/scripts/check-seo.mjs
      - name: Check content counts
        run: node .github/scripts/check-counts.mjs
      - name: Check PWA files
        run: |
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8'))"

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
      - name: Run browser smoke test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node .github/scripts/smoke-site.mjs
