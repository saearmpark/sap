name: Keep backend warm

# Render 무료 플랜은 15분 동안 요청이 없으면 인스턴스가 잠들고,
# 다음 첫 요청에 30~60초가 걸립니다(콜드 스타트). 10분마다 가벼운
# 인증 확인 엔드포인트 하나만 호출해 인스턴스를 깨어 있게 유지합니다.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 --retry 2 --retry-delay 5 \
            "https://board-backend-nngx.onrender.com/api/auth/me")
          echo "/api/auth/me responded with HTTP $code"
