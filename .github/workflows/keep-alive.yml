name: Keep backend warm

# Render 무료 플랜은 15분 동안 요청이 없으면 인스턴스가 잠들고,
# 다음 첫 요청에 30~60초가 걸립니다(콜드 스타트). 5분마다 가볍게
# 요청을 보내 인스턴스를 깨어 있게 유지해 로그인/조회를 빠르게 합니다.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend
        run: |
          for path in /api/news /api/stocks /api/auth/me; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 --retry 2 --retry-delay 5 \
              "https://board-backend-nngx.onrender.com$path")
            echo "$path responded with HTTP $code"
          done
