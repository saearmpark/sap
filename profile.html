</head><body><div class="layout"><aside class="sidebar"><nav class="nav-group" data-nav></nav></aside><main class="main">
<div class="eyebrow">PROFILE</div><h1>프로필</h1><p>로그인한 계정의 개인정보를 기록하고 관리합니다.</p>
<form id="profile-form" class="card" style="max-width:560px"><div class="form-row"><label for="profile-username">아이디</label><input id="profile-username" readonly></div><div class="form-row"><label for="profile-display">표시 이름</label><input id="profile-display" maxlength="30" required></div><div class="form-row"><label for="profile-email">이메일</label><input id="profile-email" type="email" maxlength="120"></div><div class="form-row"><label for="profile-phone">전화번호</label><input id="profile-phone" type="tel" maxlength="30"></div><div class="form-row"><label for="profile-note">메모</label><textarea id="profile-note" maxlength="500" rows="4"></textarea></div><p id="profile-status" class="form-status" role="status"></p><button type="submit">저장</button></form>
</main></div><script src="assets/common.js?v=labels-44"></script><script src="assets/auth.js?v=labels-44"></script><script src="assets/theme.js?v=labels-44"></script><script>
(() => { const form=document.getElementById("profile-form"), status=document.getElementById("profile-status"); const fields={username:document.getElementById("profile-username"),displayName:document.getElementById("profile-display"),email:document.getElementById("profile-email"),phone:document.getElementById("profile-phone"),profileNote:document.getElementById("profile-note")};
  SAPAuth.requireSession().then(async user => { if (!user) return; fields.username.value=user.username||""; fields.displayName.value=user.displayName||""; try { const r=await SAPAuth.apiFetch(`${SAPAuth.API_ROOT}/auth/me`); const data=await r.json(); Object.keys(fields).forEach(k=>{if(data[k] != null) fields[k].value=data[k];}); } catch {} });
  form.addEventListener("submit", async e=>{e.preventDefault(); status.textContent="저장 중..."; try { const r=await SAPAuth.apiFetch(`${SAPAuth.API_ROOT}/auth/profile`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({displayName:fields.displayName.value,email:fields.email.value,phone:fields.phone.value,profileNote:fields.profileNote.value})}); const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.message||"저장하지 못했습니다."); status.textContent="프로필을 저장했습니다."; } catch(err){status.textContent=err.message||"서버에 연결할 수 없습니다.";} }); })();
</script></body></html>
