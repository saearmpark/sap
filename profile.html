<script>try { if (localStorage.getItem("sap-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}</script><link rel="stylesheet" href="assets/style.css?v=labels-45">
</head><body><div class="layout"><aside class="sidebar"><nav class="nav-group" data-nav></nav></aside><main class="main">
<div class="eyebrow">PROFILE</div><h1>프로필</h1><p>로그인한 계정의 개인정보를 기록하고 관리합니다.</p>
<form id="profile-form" class="card" style="max-width:560px"><div class="form-row"><label for="profile-username">아이디</label><input id="profile-username" readonly></div><div class="form-row"><label for="profile-display">표시 이름</label><input id="profile-display" maxlength="30" required></div><div class="form-row"><label for="profile-email">이메일</label><input id="profile-email" type="email" maxlength="120"></div><div class="form-row"><label for="profile-phone">전화번호</label><input id="profile-phone" type="tel" maxlength="30"></div><div class="form-row"><label for="profile-address">주소</label><input id="profile-address" maxlength="300"></div><div class="form-row"><label for="profile-birth">생년월일</label><input id="profile-birth" type="date"></div><div class="form-row"><label for="profile-height">키</label><input id="profile-height" placeholder="예: 175cm" maxlength="20"></div><div class="form-row"><label for="profile-weight">몸무게</label><input id="profile-weight" placeholder="예: 68kg" maxlength="20"></div><div class="form-row"><label>추가 항목</label><div id="custom-fields"></div><div class="choice-controls"><button id="custom-add" type="button">항목 추가</button><button id="custom-delete-mode" type="button">삭제하기</button><button id="custom-delete" type="button" disabled>삭제</button></div></div><div class="form-row"><label for="profile-note">메모</label><textarea id="profile-note" maxlength="500" rows="4"></textarea></div><p id="profile-status" class="form-status" role="status"></p><div class="choice-controls"><button type="submit">저장</button></div></form>
</main></div><script src="assets/common.js?v=labels-45"></script><script src="assets/auth.js?v=labels-45"></script><script src="assets/theme.js?v=labels-45"></script><script>
(() => { const form=document.getElementById("profile-form"), status=document.getElementById("profile-status"), custom=document.getElementById("custom-fields"), deleteMode=document.getElementById("custom-delete-mode"), deleteButton=document.getElementById("custom-delete"); const fields={username:document.getElementById("profile-username"),displayName:document.getElementById("profile-display"),email:document.getElementById("profile-email"),phone:document.getElementById("profile-phone"),address:document.getElementById("profile-address"),birthDate:document.getElementById("profile-birth"),height:document.getElementById("profile-height"),weight:document.getElementById("profile-weight"),profileNote:document.getElementById("profile-note")};
  function addCustom(key="", value="") { const row=document.createElement("div"); row.className="choice-controls custom-profile-row"; row.innerHTML=`<input type="checkbox" class="custom-select" hidden><input placeholder="항목 이름" maxlength="30" value="${key.replaceAll('"','&quot;')}"><input placeholder="내용" maxlength="200" value="${value.replaceAll('"','&quot;')}"><button type="button" class="custom-up" aria-label="위로">↑</button><button type="button" class="custom-down" aria-label="아래로">↓</button>`; row.querySelector(".custom-up").onclick=()=>row.previousElementSibling?.before(row); row.querySelector(".custom-down").onclick=()=>row.nextElementSibling?.after(row); custom.append(row); }
  deleteMode.onclick=()=>{const boxes=custom.querySelectorAll(".custom-select"); const enabled=boxes.length>0 && boxes[0].hidden; boxes.forEach(box=>{box.hidden=!enabled; box.checked=false;}); deleteButton.disabled=!enabled; deleteMode.textContent=enabled?"삭제 취소":"삭제하기";};
  deleteButton.onclick=()=>{custom.querySelectorAll(".custom-select:checked").forEach(box=>box.closest(".custom-profile-row").remove()); deleteButton.disabled=true;};
  document.getElementById("custom-add").onclick=()=>addCustom();
  SAPAuth.requireSession().then(async user => { if (!user) return; try { const r=await SAPAuth.apiFetch(`${SAPAuth.API_ROOT}/auth/me`); const data=await r.json(); Object.keys(fields).forEach(k=>{if(data[k] != null) fields[k].value=data[k];}); Object.entries(data.customFields||{}).forEach(([k,v])=>addCustom(k,v)); } catch {} });
  form.addEventListener("submit", async e=>{e.preventDefault(); status.textContent="저장 중..."; const customFields={}; custom.querySelectorAll(".custom-profile-row").forEach(row=>{const [k,v]=row.querySelectorAll("input:not(.custom-select)"); if(k.value.trim()) customFields[k.value.trim()]=v.value.trim();}); try { const r=await SAPAuth.apiFetch(`${SAPAuth.API_ROOT}/auth/profile`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({...Object.fromEntries(Object.entries(fields).filter(([k])=>k!=="username").map(([k,v])=>[k,v.value])),customFields})}); const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.message||"저장하지 못했습니다."); status.textContent="프로필을 저장했습니다."; } catch(err){status.textContent=err.message||"서버에 연결할 수 없습니다.";} }); })();
</script></body></html>
