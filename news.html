<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#202124">
<meta name="description" content="서울·부산·대구·인천·광주·대전·천안의 오늘 날씨와 천안 24시간 시간대별 강수확률·기온을 보여줍니다.">

<meta property="og:description" content="서울·부산·대구·인천·광주·대전·천안의 오늘 날씨와 천안 24시간 시간대별 강수확률·기온을 보여줍니다.">

<title>사피엔스 — 날씨</title>
<script>try { if (localStorage.getItem("sap-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}</script>
<link rel="stylesheet" href="assets/style.css?v=labels-45">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>.weather-advice{margin-top:18px;padding:16px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}.weather-advice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.weather-advice-card{padding:12px;border-radius:8px;background:var(--bg)}.weather-advice-card strong{display:block;margin-bottom:5px}</style>

<body>
<div class="layout">
  <aside class="sidebar">
    <nav class="nav-group" data-nav></nav>
  </aside>
  <main class="main">
    <div class="eyebrow">WEATHER</div>
    <h1>날씨</h1>
    <p>대한민국 주요 도시의 오늘 날씨와 천안의 현재부터 24시간 시간대별 예상을 보여줍니다.</p>

    <section class="weather-panel" aria-label="오늘의 날씨">
      <div class="weather-head">
        <h2 class="weather-heading">오늘의 날씨</h2>
        <span id="weather-status" class="weather-status" role="status" aria-live="polite">날씨를 불러오는 중입니다...</span>
      </div>
      <div id="weather-map" class="weather-map" aria-label="대한민국 도시별 날씨 지도"></div>
      <div id="weather-grid" class="weather-grid" hidden></div>
      <div id="weather-hourly" class="weather-hourly" hidden>
        <h3 class="weather-hourly-title">천안 시간대별 예상 · 현재부터 24시간</h3>
        <div id="weather-hourly-strip" class="weather-hourly-strip"></div>
      </div>
      <section id="weather-advice" class="weather-advice" aria-label="오늘과 내일 날씨 생활 추천"><h2>오늘·내일 옷차림과 우산</h2><p>날씨 정보를 불러오면 옷차림과 우산 추천을 표시합니다.</p></section>
    </section>
  </main>
</div>
<script src="assets/common.js?v=labels-45"></script>
<script src="assets/auth.js?v=labels-45"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
  (() => {
    const mapEl = document.getElementById("weather-map");
    const gridEl = document.getElementById("weather-grid");
    const hourlyEl = document.getElementById("weather-hourly");
    const stripEl = document.getElementById("weather-hourly-strip");
    const statusEl = document.getElementById("weather-status");
    const CACHE_KEY = "sap-weather-cache-v2";
    const CITIES = [
      { name: "서울", lat: 37.5665, lon: 126.9780 },
      { name: "부산", lat: 35.1796, lon: 129.0756 },
      { name: "대구", lat: 35.8714, lon: 128.6014 },
      { name: "인천", lat: 37.4563, lon: 126.7052 },
      { name: "광주", lat: 35.1595, lon: 126.8526 },
      { name: "대전", lat: 36.3504, lon: 127.3845 },
      { name: "천안", lat: 36.8151, lon: 127.1139 },
    ];

    const WMO = {
      0: "맑음", 1: "대체로 맑음", 2: "구름 조금", 3: "흐림",
      45: "안개", 48: "안개",
      51: "이슬비", 53: "이슬비", 55: "이슬비",
      56: "어는 이슬비", 57: "어는 이슬비",
      61: "비", 63: "비", 65: "강한 비",
      66: "어는 비", 67: "어는 비",
      71: "눈", 73: "눈", 75: "많은 눈", 77: "눈",
      80: "소나기", 81: "소나기", 82: "강한 소나기",
      85: "눈 소나기", 86: "눈 소나기",
      95: "천둥번개", 96: "천둥번개", 99: "천둥번개",
    };

    function wmo(code) {
      return WMO[code] || "흐림";
    }

    const readCache = () => window.SAPCommon.readCache(CACHE_KEY);
    const writeCache = (items) => window.SAPCommon.writeCache(CACHE_KEY, items);

    function card(item) {
      const el = document.createElement("article");
      el.className = "weather-card";
      const city = document.createElement("div");
      city.className = "weather-city";
      city.textContent = item.name;
      const temp = document.createElement("div");
      temp.className = "weather-temp";
      temp.textContent = `${item.temp}°`;
      const desc = document.createElement("div");
      desc.className = "weather-desc";
      desc.textContent = wmo(item.code);
      const range = document.createElement("div");
      range.className = "weather-range";
      range.textContent = `최고 ${item.high}° · 최저 ${item.low}°`;
      el.append(city, temp, desc, range);
      if (Number.isFinite(item.precip)) {
        const rain = document.createElement("div");
        rain.className = "weather-extra";
        rain.textContent = `강수확률 ${item.precip}%`;
        el.append(rain);
      }
      if (Number.isFinite(item.morning) || Number.isFinite(item.afternoon)) {
        const half = document.createElement("div");
        half.className = "weather-extra";
        half.textContent = `오전 ${fmtTemp(item.morning)} · 오후 ${fmtTemp(item.afternoon)}`;
        el.append(half);
      }
      return el;
    }

    function render(items) {
      gridEl.replaceChildren(...items.map(card));
      const base = items.find(item => item.name === "서울") || items[0];
      if (!base) return;
      const advice = document.getElementById("weather-advice");
      const outfit = temp => temp === null ? "기온 정보를 확인할 수 없습니다." : temp <= 5 ? "두꺼운 코트나 패딩, 보온 내의를 추천합니다." : temp <= 12 ? "자켓이나 가벼운 코트와 긴팔 옷이 좋습니다." : temp <= 20 ? "가디건·자켓과 긴팔 또는 얇은 겹쳐 입기를 추천합니다." : temp <= 27 ? "얇은 긴팔이나 반팔과 가벼운 겉옷을 추천합니다." : "반팔과 통풍이 잘되는 얇은 옷을 추천합니다.";
      const umbrella = precip => precip >= 60 ? "우산을 챙기는 것이 좋습니다." : precip >= 30 ? "작은 우산을 준비하면 안심할 수 있습니다." : "우산 없이 외출해도 괜찮겠습니다.";
      advice.innerHTML = `<h2>오늘·내일 옷차림과 우산</h2><div class="weather-advice-grid"><div class="weather-advice-card"><strong>오늘 · 서울 기준 ${base.low}~${base.high}°</strong><div>${outfit(base.high)}</div><div>${umbrella(base.precip ?? 0)} (강수확률 ${base.precip ?? "-"}%)</div></div><div class="weather-advice-card"><strong>내일 · 서울 기준 ${base.tomorrowLow}~${base.tomorrowHigh}°</strong><div>${outfit(base.tomorrowHigh)}</div><div>${umbrella(base.tomorrowPrecip ?? 0)} (강수확률 ${base.tomorrowPrecip ?? "-"}%)</div></div></div>`;
      advice.hidden = false;
    }

    const escapeHtml = window.SAPCommon.escapeHtml;

    function roundValue(value) {
      return Number.isFinite(value) ? Math.round(value) : null;
    }

    function fmtTemp(value) {
      return Number.isFinite(value) ? `${value}°` : "-";
    }

    function hourValue(entry, hour, key) {
      const times = entry?.hourly?.time;
      const values = entry?.hourly?.[key];
      if (!Array.isArray(times) || !Array.isArray(values)) return null;
      const suffix = `T${String(hour).padStart(2, "0")}:00`;
      const idx = times.findIndex((t) => typeof t === "string" && t.endsWith(suffix));
      return idx >= 0 ? values[idx] : null;
    }

    let map = null;
    let markerLayer = null;

    function ensureMap() {
      if (map) return map;
      if (!window.L || !mapEl) return null;
      map = L.map(mapEl, { scrollWheelZoom: false }).setView([36.3, 127.8], 7);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }).addTo(map);
      markerLayer = L.layerGroup().addTo(map);
      return map;
    }

    function renderMap(items) {
      if (!ensureMap()) return false;
      markerLayer.clearLayers();
      items.forEach((item, index) => {
        const city = CITIES[index];
        const lat = Number.isFinite(item.lat) ? item.lat : city?.lat;
        const lon = Number.isFinite(item.lon) ? item.lon : city?.lon;
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
        const rain = Number.isFinite(item.precip)
          ? `<span class="weather-pin-meta">강수 ${item.precip}%</span>`
          : "";
        const icon = L.divIcon({
          className: "weather-pin-wrap",
          html: `<span class="weather-pin"><span class="weather-pin-city">${escapeHtml(item.name)}</span>`
            + `<span class="weather-pin-temp">${item.temp}°</span>${rain}</span>`,
          iconSize: [76, 58],
          iconAnchor: [38, 58],
        });
        const detail = [`최고 ${item.high}° · 최저 ${item.low}°`];
        if (Number.isFinite(item.precip)) detail.push(`강수확률 ${item.precip}%`);
        if (Number.isFinite(item.morning) || Number.isFinite(item.afternoon)) {
          detail.push(`오전 ${fmtTemp(item.morning)} · 오후 ${fmtTemp(item.afternoon)}`);
        }
        L.marker([lat, lon], { icon }).addTo(markerLayer).bindPopup(
          `<b>${escapeHtml(item.name)}</b><br>${escapeHtml(wmo(item.code))} · ${item.temp}°<br>`
          + detail.join("<br>")
        );
      });
      return true;
    }

    function show(items) {
      render(items);
      if (window.L && renderMap(items)) {
        gridEl.hidden = true;
      } else {
        gridEl.hidden = false;
      }
      renderHourly(items);
    }

    function seoulNow() {
      try {
        const values = Object.fromEntries(new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Seoul",
          year: "numeric", month: "2-digit", day: "2-digit",
          hour: "2-digit", hour12: false,
        }).formatToParts(new Date())
          .filter((part) => part.type !== "literal")
          .map((part) => [part.type, part.value]));
        const hour = String(Number(values.hour) % 24).padStart(2, "0");
        const date = `${values.year}-${values.month}-${values.day}`;
        return { date, key: `${date}T${hour}:00` };
      } catch {
        const now = new Date();
        const date = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
        return { date, key: `${date}T${String(now.getHours()).padStart(2, "0")}:00` };
      }
    }

    function hourChip(hour, isNow, today) {
      const el = document.createElement("div");
      el.className = isNow ? "weather-hour is-now" : "weather-hour";
      const time = document.createElement("span");
      time.className = "weather-hour-time";
      const day = hour.iso?.slice(0, 10) === today ? "오늘" : "내일";
      time.textContent = isNow ? "지금" : `${day} ${hour.h}시`;
      const temp = document.createElement("span");
      temp.className = "weather-hour-temp";
      temp.textContent = fmtTemp(hour.t);
      const rain = document.createElement("span");
      rain.className = "weather-hour-rain";
      rain.textContent = Number.isFinite(hour.p) ? `${hour.p}%` : "-";
      el.title = `${hour.iso?.slice(0, 10) || day} ${String(hour.h).padStart(2, "0")}시 · ${fmtTemp(hour.t)} · 강수 ${Number.isFinite(hour.p) ? `${hour.p}%` : "-"}`;
      el.append(time, temp, rain);
      return el;
    }

    function renderHourly(items) {
      const cheonan = items.find((item) => item.name === "천안");
      const hours = cheonan && Array.isArray(cheonan.hours) ? cheonan.hours : null;
      const timed = hours ? hours.filter((hour) => typeof hour.iso === "string") : [];
      if (!timed.length) {
        hourlyEl.hidden = true;
        return;
      }
      const now = seoulNow();
      const start = timed.findIndex((hour) => hour.iso >= now.key);
      const visible = start >= 0 ? timed.slice(start, start + 24) : timed.slice(-24);
      stripEl.replaceChildren(...visible.map((hour) => hourChip(hour, hour.iso === now.key, now.date)));
      hourlyEl.hidden = false;
    }

    async function load() {
      const cached = readCache();
      if (cached) {
        show(cached.items);
        statusEl.textContent = "저장된 날씨를 먼저 표시합니다...";
      } else {
        statusEl.textContent = "날씨를 불러오는 중입니다...";
      }
      try {
        const lat = CITIES.map(city => city.lat).join(",");
        const lon = CITIES.map(city => city.lon).join(",");
        const url = "https://api.open-meteo.com/v1/forecast"
          + `?latitude=${lat}&longitude=${lon}`
          + "&current=temperature_2m,weather_code"
          + "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max"
          + "&hourly=temperature_2m,precipitation_probability"
          + "&timezone=Asia%2FSeoul&forecast_days=2";
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const list = Array.isArray(data) ? data : [data];
        const items = list.map((entry, index) => ({
          name: CITIES[index]?.name || `지역 ${index + 1}`,
          lat: CITIES[index]?.lat,
          lon: CITIES[index]?.lon,
          temp: Math.round(entry.current.temperature_2m),
          code: entry.current.weather_code,
          high: Math.round(entry.daily.temperature_2m_max[0]),
          low: Math.round(entry.daily.temperature_2m_min[0]),
          precip: roundValue(entry.daily?.precipitation_probability_max?.[0]),
          tomorrowHigh: roundValue(entry.daily?.temperature_2m_max?.[1]),
          tomorrowLow: roundValue(entry.daily?.temperature_2m_min?.[1]),
          tomorrowPrecip: roundValue(entry.daily?.precipitation_probability_max?.[1]),
          morning: roundValue(hourValue(entry, 9, "temperature_2m")),
          afternoon: roundValue(hourValue(entry, 15, "temperature_2m")),
          hours: CITIES[index]?.name === "천안" && Array.isArray(entry.hourly?.time)
            ? entry.hourly.time.map((iso, i) => ({
                iso,
                h: Number(iso.slice(11, 13)),
                t: roundValue(entry.hourly.temperature_2m?.[i]),
                p: roundValue(entry.hourly.precipitation_probability?.[i]),
              }))
            : undefined,
        }));
        show(items);
        writeCache(items);
        const stamp = new Date().toLocaleTimeString("ko-KR", {
          timeZone: "Asia/Seoul", hour: "2-digit", minute: "2-digit",
        });
        statusEl.textContent = `실시간 · ${stamp} 기준`;
      } catch (error) {
        document.getElementById("weather-advice").innerHTML = "<h2>오늘·내일 옷차림과 우산</h2><p>날씨 정보를 불러오지 못해 추천을 계산할 수 없습니다. 잠시 후 새로고침해 주세요.</p>";
        statusEl.textContent = readCache()
          ? "날씨 서버 연결이 느립니다. 저장된 정보를 표시합니다."
          : "날씨를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.";
      }
    }

    load();
    setInterval(load, 10 * 60 * 1000);
  })();
</script>
<script src="assets/theme.js?v=labels-45"></script>
</body>
</html>
