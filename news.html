    <h1>이슈사항</h1>
    <p>국내 핫이슈를 10분마다 자동으로 모아 보여줍니다.</p>

    <p id="news-status" class="news-status" role="status" aria-live="polite">소식을 불러오는 중입니다...</p>
    <div id="news-list" class="news-list"></div>
  </main>

<script src="assets/auth.js?v=labels-9"></script>
<script>
  (() => {
    const API = window.SAPAuth?.API_ROOT || "https://board-backend-nngx.onrender.com/api";
    const listEl = document.getElementById("news-list");
    const statusEl = document.getElementById("news-status");
    const CACHE_KEY = "sap-news-cache";
    let items = [];

    function readCache() {
      try {
        const raw = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
        return raw && Array.isArray(raw.items) && raw.items.length ? raw : null;
      } catch { return null; }
    }

    function writeCache(data) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ items: data, savedAt: Date.now() })); } catch {}
    }

    function relTime(iso) {
      if (!iso) return "";
      const time = new Date(iso).getTime();
      if (Number.isNaN(time)) return "";
      const minutes = Math.round((Date.now() - time) / 60000);
      if (minutes < 1) return "방금 전";
      if (minutes < 60) return `${minutes}분 전`;
      const hours = Math.round(minutes / 60);
      if (hours < 24) return `${hours}시간 전`;
      return `${Math.round(hours / 24)}일 전`;
    }

    function card(item) {
      const link = document.createElement("a");
      link.className = "news-card";
      link.href = item.link;
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      if (item.imageUrl) {
        const thumb = document.createElement("img");
        thumb.className = "news-thumb";
        thumb.src = item.imageUrl;
        thumb.alt = "";
        thumb.loading = "lazy";
        thumb.referrerPolicy = "no-referrer";
        thumb.addEventListener("error", () => thumb.remove());
        link.appendChild(thumb);
      }

      const body = document.createElement("div");
      body.className = "news-body";

      const title = document.createElement("h3");
      title.textContent = item.title;
      body.appendChild(title);

      const meta = document.createElement("div");
      meta.className = "news-meta";
      if (item.source) {
        const source = document.createElement("span");
        source.textContent = item.source;
        meta.appendChild(source);
      }
      const time = document.createElement("span");
      time.textContent = relTime(item.publishedAt || item.fetchedAt);
      meta.appendChild(time);
      body.appendChild(meta);

      if (item.summary) {
        const summary = document.createElement("p");
        summary.className = "news-summary";
        summary.textContent = item.summary;
        body.appendChild(summary);
      }

      link.appendChild(body);
      return link;
    }

    function render() {
      if (!items.length) {
        const empty = document.createElement("p");
        empty.className = "news-empty";
        empty.textContent = "표시할 소식이 없습니다.";
        listEl.replaceChildren(empty);
        return;
      }
      listEl.replaceChildren(...items.map(card));
    }

    async function load() {
      const cached = readCache();
      if (cached) {
        items = cached.items;
        render();
        statusEl.textContent = `저장된 소식 ${items.length}건을 먼저 표시합니다...`;
      } else {
        statusEl.textContent = "소식을 불러오는 중입니다...";
      }
      try {
        const response = await fetch(`${API}/news`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        items = await response.json();
        const updated = items[0]?.fetchedAt || items[0]?.publishedAt;
        statusEl.textContent = items.length
          ? `총 ${items.length}건 · ${relTime(updated)} 갱신`
          : "아직 수집된 소식이 없습니다. 잠시 후 다시 확인해주세요.";
        render();
        if (items.length) writeCache(items);
      } catch (error) {
        if (cached) {
          statusEl.textContent = `서버 연결이 느립니다. 저장된 소식 ${items.length}건을 표시합니다.`;
          return;
        }
        statusEl.textContent = "소식을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.";
        listEl.replaceChildren();
      }
    }

    load();
    setInterval(load, 5 * 60 * 1000);
  })();
</script>
<script src="assets/theme.js"></script>
