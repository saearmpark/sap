<body>

      </div>
      <div class="briefing-grid">

          <span class="brief-main" data-brief-main>불러오는 중...</span>

        </a>
        <a class="brief-card" href="stocks.html" id="brief-market">
          <span class="brief-label">MARKETS · 국내</span>
          <ul class="brief-list" data-brief-list><li>불러오는 중...</li></ul>

<script src="assets/common.js?v=labels-35"></script>
<script src="assets/auth.js?v=labels-35"></script>
<script>
  (() => {
    const API = window.SAPCommon.API_ROOT;
    const { localDate, addDays, addMonths, withTimeout } = window.SAPCommon;
    const statusEl = document.getElementById("briefing-status");
    const WEATHER_CACHE_KEY = "sap-weather-cache-v2";
    const STOCKS_CACHE_KEY = "sap-stocks-cache";
    const WATCHLIST_KEY = "sap-stock-watchlist";
    const DEFAULT_WATCHLIST = ["005930", "000660", "069500"];
    const STUDY_HISTORY_KEY = "sap-english-opic-history-v1";
    const WEATHER_TEXT = {
      0: "맑음", 1: "대체로 맑음", 2: "구름 조금", 3: "흐림",
      45: "안개", 48: "안개", 51: "이슬비", 53: "이슬비", 55: "이슬비",
      56: "어는 이슬비", 57: "어는 이슬비", 61: "비", 63: "비", 65: "강한 비",
      66: "어는 비", 67: "어는 비", 71: "눈", 73: "눈", 75: "많은 눈", 77: "눈",
      80: "소나기", 81: "소나기", 82: "강한 소나기", 85: "눈 소나기", 86: "눈 소나기",
      95: "천둥번개", 96: "천둥번개", 99: "천둥번개"
    };

    function setStatus(message) {
      if (statusEl) statusEl.textContent = message;
    }

    function setText(cardId, selector, value) {
      const element = document.querySelector(`#${cardId} ${selector}`);
      if (element) element.textContent = value;
    }

    function parseCache(key) {
      try {
        return JSON.parse(localStorage.getItem(key) || "null");
      } catch {
        return null;
      }
    }

    function readWatchlist() {
      try {
        const raw = localStorage.getItem(WATCHLIST_KEY);
        if (raw === null) return DEFAULT_WATCHLIST.slice();
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return DEFAULT_WATCHLIST.slice();
        return [...new Set(parsed.filter(symbol => typeof symbol === "string" && symbol))];
      } catch {
        return DEFAULT_WATCHLIST.slice();
      }
    }

    function expandOccurrences(events, rangeStart, rangeEnd) {
      return window.SAPCommon.expandOccurrences(events, rangeStart, rangeEnd).map(event => ({
        title: event.title,
        publicEvent: event.public_event,
        start: event.start_date,
        end: event.end_date,
      }));
    }

    function weatherName(code) {
      return WEATHER_TEXT[code] || "흐림";
    }

    function renderWeather(item) {
      const current = Number.isFinite(item.temp) ? `${Math.round(item.temp)}°` : "-";
      const parts = [weatherName(item.code)];
      if (Number.isFinite(item.high) && Number.isFinite(item.low)) {
        parts.push(`최고 ${Math.round(item.high)}° · 최저 ${Math.round(item.low)}°`);
      }
      if (Number.isFinite(item.precip)) parts.push(`강수 ${Math.round(item.precip)}%`);
      setText("brief-weather", "[data-brief-main]", current);
      setText("brief-weather", "[data-brief-sub]", parts.join(" · "));
    }

    function renderMarket(quotes) {
      const list = document.querySelector("#brief-market [data-brief-list]");
      if (!list) return;
      const symbols = readWatchlist();
      const resolved = symbols
        .map(symbol => quotes.find(quote => quote.symbol === symbol))
        .filter(Boolean)
        .slice(0, 3);
      list.replaceChildren();
      if (!resolved.length) {
        const empty = document.createElement("li");
        empty.textContent = symbols.length ? "관심종목 시세를 기다리는 중입니다." : "관심종목을 추가하면 시세를 보여줍니다.";
        list.appendChild(empty);
        setText("brief-market", "[data-brief-sub]", symbols.length ? "관심종목" : "관심종목을 추가하세요");
        return;
      }
      resolved.forEach(quote => {
        const row = document.createElement("li");
        const name = document.createElement("span");
        name.className = "brief-title";
        name.textContent = quote.name;
        const change = document.createElement("span");
        change.className = `stock-change ${quote.change >= 0 ? "is-up" : "is-down"}`;
        const percent = Number.isFinite(quote.changePercent) ? quote.changePercent : 0;
        change.textContent = `${percent > 0 ? "+" : ""}${percent.toFixed(2)}%`;
        row.append(name, change);
        list.appendChild(row);
      });
      setText("brief-market", "[data-brief-sub]", `관심종목 ${resolved.length}개`);
    }

    function renderCachedMarket() {
      const cached = parseCache(STOCKS_CACHE_KEY);
      if (Array.isArray(cached) && cached.length) renderMarket(cached);
    }

    window.addEventListener("storage", event => {
      if (event.key === WATCHLIST_KEY) renderCachedMarket();
    });
    window.addEventListener("pageshow", event => {
      if (event.persisted) renderCachedMarket();
    });

    function renderSchedule(events, todayKey) {
      const list = document.querySelector("#brief-schedule [data-brief-list]");
      if (!list) return;
      list.replaceChildren();
      if (!events.length) {
        const empty = document.createElement("li");
        empty.textContent = "다가오는 일정이 없습니다.";
        list.appendChild(empty);
        return;
      }
      events.forEach(event => {
        const row = document.createElement("li");
        const title = document.createElement("span");
        title.className = "brief-title";
        title.textContent = `${event.publicEvent ? "[공개] " : ""}${event.title}`;
        const badge = document.createElement("span");
        badge.className = "dday";
        const days = Math.round((new Date(`${event.start}T00:00:00`) - new Date(`${todayKey}T00:00:00`)) / 86400000);
        badge.textContent = days <= 0 ? "D-DAY" : `D-${days}`;
        row.append(title, badge);
        list.appendChild(row);
      });
    }

    async function loadWeather() {
      const cached = parseCache(WEATHER_CACHE_KEY);
      const cachedCheonan = Array.isArray(cached?.items)
        ? cached.items.find(item => item.name === "천안")
        : null;
      if (cachedCheonan) renderWeather(cachedCheonan);
      try {
        const url = "https://api.open-meteo.com/v1/forecast"
          + "?latitude=36.8151&longitude=127.1139"
          + "&current=temperature_2m,weather_code"
          + "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max"
          + "&timezone=Asia%2FSeoul&forecast_days=1";
        const response = await withTimeout(fetch(url, { cache: "no-store" }), 8000);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        renderWeather({
          temp: data.current?.temperature_2m,
          code: data.current?.weather_code,
          high: data.daily?.temperature_2m_max?.[0],
          low: data.daily?.temperature_2m_min?.[0],
          precip: data.daily?.precipitation_probability_max?.[0]
        });
        return true;
      } catch {
        if (!cachedCheonan) {
          setText("brief-weather", "[data-brief-main]", "--");
          setText("brief-weather", "[data-brief-sub]", "날씨를 불러오지 못했습니다.");
        }
        return false;
      }
    }

    async function loadMarket() {
      const cached = parseCache(STOCKS_CACHE_KEY);
      const hasCache = Array.isArray(cached) && cached.length > 0;
      if (hasCache) renderMarket(cached);
      try {
        const response = await withTimeout(fetch(`${API}/stocks`, { cache: "no-store" }), 12000);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const quotes = Array.isArray(data.quotes) ? data.quotes : [];
        if (!quotes.length) throw new Error("empty");
        renderMarket(quotes);
        try {
          localStorage.setItem(STOCKS_CACHE_KEY, JSON.stringify(quotes));
        } catch {}
        return true;
      } catch {
        if (!hasCache) {
          const list = document.querySelector("#brief-market [data-brief-list]");
          if (list) {
            const empty = document.createElement("li");
            empty.textContent = "시세를 불러오지 못했습니다.";
            list.replaceChildren(empty);
          }
          setText("brief-market", "[data-brief-sub]", "잠시 후 다시 시도해 주세요.");
        }
        return false;
      }
    }

    async function loadSchedule() {
      const list = document.querySelector("#brief-schedule [data-brief-list]");
      if (!SAPAuth.getToken()) {
        if (list) list.innerHTML = '<li><span class="brief-title">로그인하면 일정을 볼 수 있어요.</span></li>';
        return true;
      }
      try {
        const response = await withTimeout(
          SAPAuth.apiFetch(`${API}/events`, { suppressAuthRedirect: true }),
          8000
        );
        if (response.status === 401) {
          SAPAuth.clearSession();
          if (list) list.innerHTML = '<li><span class="brief-title">로그인하면 일정을 볼 수 있어요.</span></li>';
          return true;
        }
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const events = await response.json();
        if (!Array.isArray(events)) throw new Error("invalid");
        const todayKey = localDate(new Date());
        const horizon = addDays(todayKey, 7);
        const upcoming = expandOccurrences(events, todayKey, horizon)
          .filter(event => event.end >= todayKey)
          .sort((a, b) => a.start.localeCompare(b.start))
          .slice(0, 3);
        renderSchedule(upcoming, todayKey);
        return true;
      } catch {
        if (list) list.innerHTML = '<li><span class="brief-title">일정을 불러오지 못했습니다.</span></li>';
        return false;
      }
    }

    function loadStudy() {
      const history = parseCache(STUDY_HISTORY_KEY);
      const records = Array.isArray(history)
        ? history.filter(record => record && typeof record.averageScore === "number")
        : [];
      if (!records.length) return true;
      const latest = records[0];
      const best = Math.max(...records.map(record => record.averageScore));
      setText("brief-study", "[data-brief-main]", `${latest.averageGrade} · ${latest.averageScore}점`);
      setText("brief-study", "[data-brief-sub]", `최근 ${records.length}회 · 최고 ${best}점`);
      return true;
    }

    Promise.all([loadWeather(), loadMarket(), loadSchedule(), loadStudy()]).then(results => {
      if (!SAPAuth.getToken()) {
        setStatus("일부 정보는 로그인 후 표시됩니다.");
      } else if (results.some(result => result === false)) {
        setStatus("일부 정보는 연결 후 갱신됩니다.");
      } else {
        setStatus("방금 업데이트");
      }
    });
  })();
</script>
<script src="assets/theme.js?v=labels-35"></script>
</body>
