<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codestudio — 자료실</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">code<span>studio</span> // 새암</div>
    <nav class="nav-group">
      <div class="nav-label">MENU</div>
      <a href="index.html">홈</a>
      <a href="board.html">게시판</a>
      <a href="files.html" class="active">자료실</a>
      <a href="game.html">게임제작</a>
      <a href="app.html">APP제작</a>
      <a href="mypage.html">마이페이지</a>
    </nav>
    <div class="sidebar-footer">v0.1 · local build</div>
  </aside>
  <main class="main">
    <div class="eyebrow">ARCHIVE</div>
    <h1>자료실</h1>
    <p class="lead">
      참고 문서, 강의 노트, 소스코드를 업로드하고 다운로드하는 공간입니다.
      <code>backend-python</code>의 Flask 서버가 켜져 있어야 동작합니다. (최대 20MB)
    </p>

    <form id="upload-form" class="card">
      <h3>파일 업로드</h3>
      <div class="form-row">
        <input type="file" id="file-input" required>
      </div>
      <button type="submit">업로드</button>
      <span id="form-status" class="form-status"></span>
    </form>

    <table>
      <thead>
        <tr><th>파일명</th><th>크기</th><th>업로드일</th><th></th></tr>
      </thead>
      <tbody id="file-list">
        <tr><td colspan="4">불러오는 중...</td></tr>
      </tbody>
    </table>
  </main>
</div>

<script>
  const API_BASE = "http://127.0.0.1:5000/api/files";

  async function loadFiles() {
    const listEl = document.getElementById("file-list");
    try {
      const res = await fetch(API_BASE);
      if (!res.ok) throw new Error("서버 응답 오류");
      const files = await res.json();

      if (files.length === 0) {
        listEl.innerHTML = '<tr><td colspan="4">아직 업로드된 자료가 없습니다.</td></tr>';
        return;
      }

      listEl.innerHTML = files.map(f => `
        <tr>
          <td><a href="${API_BASE}/${encodeURIComponent(f.stored_name)}">${escapeHtml(f.original_name)}</a></td>
          <td>${f.size_display}</td>
          <td>${f.uploaded_at}</td>
          <td><button data-name="${f.stored_name}" class="delete-btn">삭제</button></td>
        </tr>
      `).join("");

      document.querySelectorAll(".delete-btn").forEach(btn => {
        btn.addEventListener("click", () => deleteFile(btn.dataset.name));
      });
    } catch (err) {
      listEl.innerHTML =
        '<tr><td colspan="4">서버에 연결할 수 없습니다. backend-python 서버가 실행 중인지 확인하세요.</td></tr>';
    }
  }

  async function deleteFile(storedName) {
    await fetch(`${API_BASE}/${encodeURIComponent(storedName)}`, { method: "DELETE" });
    loadFiles();
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById("upload-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("file-input");
    const statusEl = document.getElementById("form-status");

    if (!input.files.length) return;

    const formData = new FormData();
    formData.append("file", input.files[0]);

    try {
      const res = await fetch(API_BASE, { method: "POST", body: formData });
      if (!res.ok) throw new Error();

      statusEl.textContent = "업로드되었습니다.";
      document.getElementById("upload-form").reset();
      loadFiles();
    } catch (err) {
      statusEl.textContent = "업로드 실패 — 서버 연결을 확인하세요.";
    }
  });

  loadFiles();
</script>
</body>
</html>
