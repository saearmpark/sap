<!DOCTYPE html>

<head>

<meta property="og:url" content="https://saearmpark.github.io/sap/notice.html">

<title>사피엔스 — 공지사항</title>
<script>try { if (localStorage.getItem("sap-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}</script>
<link rel="stylesheet" href="assets/style.css?v=labels-41">
<style>
  .post-title-btn {
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    text-decoration: underline;
    cursor: pointer;
    font-size: inherit;
    font-family: inherit;
  }
  .board-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .board-toolbar input[type="search"] {
    min-height: 40px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
  }
  .board-toolbar input[type="search"] { flex: 1 1 220px; }
  .row-actions { display: flex; gap: 6px; }
  .row-actions button { padding: 5px 9px; }
  .edit-btn { background: transparent; color: var(--ink-soft); border: 1px solid var(--border); }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-box {
    background: #fff;
    max-width: 560px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    border-radius: 8px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
  }
  .modal-box h3 { margin-top: 0; }
  .modal-meta { color: #888; font-size: 0.9em; margin-bottom: 16px; }
  .modal-content { white-space: pre-wrap; line-height: 1.6; }
  .modal-close {
    margin-top: 20px;
    display: inline-block;
  }
  .comment-section { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 14px; }
  .comment-section h4 { margin: 0 0 10px; }
  .comment-list { display: grid; gap: 8px; padding: 0; margin: 0 0 12px; list-style: none; }
  .comment-list li { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); font-size: 14px; }
  .comment-list li .comment-body { flex: 1; overflow-wrap: anywhere; }
  .comment-list li .comment-meta { flex: none; color: var(--ink-soft); font-size: 12px; }
  .comment-form { display: flex; gap: 8px; align-items: flex-start; }
  .comment-form textarea { flex: 1; min-height: 44px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; resize: vertical; }
  .comment-empty { color: var(--ink-soft); font-size: 13px; margin: 0 0 12px; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <nav class="nav-group" data-nav></nav>
  </aside>
  <main class="main">
    <div class="eyebrow">NOTICE</div>
    <h1>공지사항</h1>

    <form id="post-form" class="card" hidden>
      <h3 id="post-form-title">새 공지 쓰기</h3>
      <div class="form-row">
        <input type="text" id="title" placeholder="제목" required>
      </div>
      <div class="form-row">
        <textarea id="content" rows="3" placeholder="내용" required></textarea>
      </div>
      <div class="row-actions">
        <button type="submit" id="post-submit">등록</button>
        <button type="button" id="post-cancel" class="edit-btn" hidden>취소</button>
      </div>
      <span id="form-status" class="form-status"></span>
    </form>

    <form id="filter-form" class="card board-toolbar">
      <input id="search" type="search" placeholder="제목·내용 검색" autocomplete="off">
      <button type="submit">검색</button>
      <button type="button" id="filter-reset" class="edit-btn">초기화</button>
      <span id="filter-status" class="form-status" aria-live="polite"></span>
    </form>

    <table>
      <thead>
        <tr><th>번호</th><th>제목</th><th>작성자</th><th>작성일</th><th></th></tr>
      </thead>
      <tbody id="post-list">
        <tr><td colspan="5">불러오는 중...</td></tr>
      </tbody>
    </table>
  </main>
</div>

<div id="post-modal" class="modal-overlay" hidden>
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <div id="modal-meta" class="modal-meta"></div>
    <div id="modal-content" class="modal-content"></div>
    <div class="comment-section">
      <h4>댓글</h4>
      <ul id="comment-list" class="comment-list"></ul>
      <form id="comment-form" class="comment-form">
        <textarea id="comment-input" maxlength="2000" rows="2" placeholder="댓글을 입력하세요" required></textarea>
        <button type="submit">댓글 등록</button>
      </form>
      <span id="comment-status" class="form-status" aria-live="polite"></span>
    </div>
    <button id="modal-close" class="modal-close">닫기</button>
  </div>
</div>

<script src="assets/common.js?v=labels-41"></script>
<script src="assets/auth.js?v=labels-41"></script>
<script src="assets/posts-page.js?v=labels-41"></script>
<script>
  SAPPosts.mount({ noun: "공지", category: "공지", formAdminOnly: true });
</script>
<script src="assets/theme.js?v=labels-41"></script>
</body>
</html>
