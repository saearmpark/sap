<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codestudio — 로그인</title>
<script>try { if (localStorage.getItem("sap-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}</script>
<link rel="stylesheet" href="assets/style.css?v=learning-sidebar-menu-1">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <button class="theme-toggle" type="button" data-theme-toggle>◐ 블랙모드</button>
    <nav class="nav-group">
      <div class="nav-label">MENU</div>
      <a href="index.html">홈</a>
      <a href="calendar.html">일정</a>
      <details class="nav-learning">
        <summary>학습</summary>
        <div class="nav-submenu">
          <a href="learn.html">앱제작</a>
          <a href="game.html">게임제작</a>
          <a href="concepts.html">개념학습</a>
          <a href="web.html">웹제작</a>
        </div>
      </details>
      <a href="board.html">게시판</a>
      <a href="files.html">자료실</a>
      <a href="login.html" class="active" data-auth-link>로그인 / 회원가입</a>
    </nav>
    <div class="sidebar-footer">v0.1 · local build</div>
  </aside>
  <main class="main">
    <div class="eyebrow">ACCOUNT</div>
    <h1>로그인 / 회원가입</h1>
    <p class="lead">회원가입 신청은 관리자 승인 후 이용할 수 있습니다. 승인된 계정으로 로그인하면 게시판과 자료실을 사용할 수 있습니다.</p>
    <section class="card auth-card">
      <div class="auth-tabs" role="tablist" aria-label="계정 메뉴">
        <button type="button" id="show-login" role="tab" aria-selected="true">로그인</button>
        <button type="button" id="show-register" role="tab" aria-selected="false">회원가입</button>
      </div>
      <form id="login-form">
        <div class="form-row"><label for="login-username">아이디</label><input id="login-username" name="username" autocomplete="username" required minlength="3"></div>
        <div class="form-row"><label for="login-password">비밀번호</label><input id="login-password" name="password" type="password" autocomplete="current-password" required></div>
        <button type="submit">로그인</button>
      </form>
      <form id="register-form" hidden>
        <div class="form-row"><label for="register-name">표시 이름</label><input id="register-name" name="displayName" autocomplete="nickname" required maxlength="30"></div>
        <div class="form-row"><label for="register-username">아이디</label><input id="register-username" name="username" autocomplete="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" aria-describedby="username-help"><div id="username-help" class="auth-note">영문, 숫자, 밑줄(_)을 사용해 3~30자로 입력하세요.</div></div>
        <div class="form-row"><label for="register-password">비밀번호</label><input id="register-password" name="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="password-help"><div id="password-help" class="auth-note">8자 이상 입력하세요.</div></div>
        <button type="submit">회원가입</button>
      </form>
      <section id="password-change" class="password-panel" hidden aria-labelledby="password-title">
        <h2 id="password-title">비밀번호 변경</h2>
        <p class="auth-note">현재 비밀번호를 확인한 뒤 새 비밀번호를 설정합니다. 변경 후에는 모든 기기에서 로그아웃되므로 새 비밀번호로 다시 로그인하세요.</p>
        <form id="password-form">
          <div class="form-row"><label for="current-password">현재 비밀번호</label><input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required></div>
          <div class="form-row"><label for="new-password">새 비밀번호</label><input id="new-password" name="newPassword" type="password" autocomplete="new-password" required minlength="8" aria-describedby="new-password-help"><div id="new-password-help" class="auth-note">8자 이상 입력하세요.</div></div>
          <div class="form-row"><label for="confirm-password">새 비밀번호 확인</label><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8"></div>
          <button type="submit">비밀번호 변경</button>
        </form>
      </section>
      <p id="auth-status" class="form-status" role="status" aria-live="polite"></p>
    </section>
  </main>
</div>
<script src="assets/auth.js?v=password-change-redirect-1"></script>
<script>
  const loginForm = document.getElementById("login-form");
  const registerForm = document.getElementById("register-form");
  const status = document.getElementById("auth-status");
  const passwordPanel = document.getElementById("password-change");
  const passwordForm = document.getElementById("password-form");

  async function showPasswordPanelForSignedInUser() {
    const token = SAPAuth.getToken();
    if (!token) return;
    try {
      const response = await fetch(`${SAPAuth.API_ROOT}/auth/me`, { headers: { Authorization: `Bearer ${token}` } });
      if (response.ok) {
        passwordPanel.hidden = false;
        document.querySelector(".auth-tabs").hidden = true;
        loginForm.hidden = true;
        registerForm.hidden = true;
        if (location.hash === "#password-change") passwordPanel.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      else SAPAuth.clearSession();
    } catch {
      // Keep the login page usable when the backend is temporarily unavailable.
    }
  }

  passwordForm.addEventListener("submit", async event => {
    event.preventDefault();
    const fields = Object.fromEntries(new FormData(passwordForm).entries());
    if (fields.newPassword !== fields.confirmPassword) {
      status.textContent = "새 비밀번호와 확인 값이 일치하지 않습니다.";
      return;
    }
    status.textContent = "비밀번호 변경 중...";
    try {
      const response = await SAPAuth.apiFetch(`${SAPAuth.API_ROOT}/auth/password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ currentPassword: fields.currentPassword, newPassword: fields.newPassword })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.message || result.detail || "비밀번호를 변경하지 못했습니다.");
      SAPAuth.clearSession();
      status.textContent = `${result.message || "비밀번호가 변경되었습니다."} 로그인 화면으로 이동합니다.`;
      setTimeout(() => location.replace("login.html"), 1200);
    } catch (error) {
      status.textContent = error instanceof TypeError
        ? "인증 서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요."
        : error.message;
    }
  });

  function selectForm(mode) {
    const isLogin = mode === "login";
    loginForm.hidden = !isLogin;
    registerForm.hidden = isLogin;
    document.getElementById("show-login").setAttribute("aria-selected", String(isLogin));
    document.getElementById("show-register").setAttribute("aria-selected", String(!isLogin));
    status.textContent = "";
  }

  async function submitAuth(event, mode) {
    event.preventDefault();
    const fields = Object.fromEntries(new FormData(event.currentTarget).entries());
    status.textContent = mode === "login" ? "로그인 중..." : "가입 중...";
    try {
      const response = await SAPAuth.apiFetch(`${SAPAuth.API_ROOT}/auth/${mode}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(fields)
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.message || result.detail || "요청을 처리하지 못했습니다.");
      if (mode === "register") {
        registerForm.reset();
        selectForm("login");
        status.textContent = result.message || "가입 신청이 완료되었습니다. 관리자 승인 후 로그인할 수 있습니다.";
        return;
      }
      SAPAuth.saveSession(result);
      const params = new URLSearchParams(location.search);
      if (params.get("mode") === "password-change") {
        location.replace("login.html#password-change");
        return;
      }
      const requested = params.get("next") || "index.html";
      const allowed = ["index.html", "board.html", "files.html", "calendar.html", "learn.html", "game.html", "admin.html"];
      location.replace(allowed.includes(requested) ? requested : "index.html");
    } catch (error) {
      status.textContent = error instanceof TypeError
        ? "인증 서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요."
        : error.message;
    }
  }

  document.getElementById("show-login").addEventListener("click", () => selectForm("login"));
  document.getElementById("show-register").addEventListener("click", () => selectForm("register"));
  loginForm.addEventListener("submit", event => submitAuth(event, "login"));
  registerForm.addEventListener("submit", event => submitAuth(event, "register"));
  if (new URLSearchParams(location.search).get("mode") === "register") selectForm("register");
  showPasswordPanelForSignedInUser();
</script>
<script src="assets/theme.js"></script>
</body>
</html>
